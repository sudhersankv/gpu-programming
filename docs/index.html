<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>APC Nsight A/B — LLM Inference Runtime Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --ink: #14212b;
      --muted: #5a6b78;
      --line: rgba(20, 33, 43, 0.12);
      --paper: #f3f6f8;
      --panel: rgba(255, 255, 255, 0.78);
      --off: #c45c26;
      --on: #0f7a6c;
      --accent: #1f6f8b;
      --shadow: 0 18px 50px rgba(20, 33, 43, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: "Outfit", system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(31, 111, 139, 0.16), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(15, 122, 108, 0.12), transparent 50%),
        linear-gradient(180deg, #e8eef2 0%, var(--paper) 40%, #eef3f5 100%);
      min-height: 100vh;
    }

    .wrap {
      width: min(1120px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2.5rem 0 4rem;
    }

    header.hero {
      display: grid;
      gap: 1rem;
      margin-bottom: 2rem;
      padding: 1.75rem 0 0.5rem;
    }

    .eyebrow {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 500;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.85rem, 4vw, 2.75rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      max-width: 16ch;
    }

    .lede {
      margin: 0;
      max-width: 42rem;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.55;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      margin-top: 0.35rem;
    }

    .chip {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.75rem;
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      background: rgba(255,255,255,0.7);
      border: 1px solid var(--line);
      color: var(--ink);
    }

    .caveat {
      margin-top: 0.5rem;
      padding: 0.9rem 1rem;
      border-left: 3px solid var(--accent);
      background: rgba(255,255,255,0.55);
      border-radius: 0 12px 12px 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      gap: 1.1rem;
    }

    .grid-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    @media (max-width: 860px) {
      .grid-2, .grid-4 { grid-template-columns: 1fr; }
    }

    section {
      margin-top: 1.75rem;
    }

    section h2 {
      margin: 0 0 0.75rem;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }

    .panel {
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.15rem 1.2rem 1.25rem;
    }

    .panel p.note {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.45;
    }

    .kpi {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      min-height: 100%;
    }

    .kpi .label {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .kpi .value {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .kpi .sub {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .legend {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
      font-size: 0.88rem;
    }

    .swatch {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .swatch i {
      width: 0.7rem;
      height: 0.7rem;
      border-radius: 3px;
      display: inline-block;
    }

    .swatch.off i { background: var(--off); }
    .swatch.on i { background: var(--on); }

    .chart-box {
      position: relative;
      height: 280px;
    }

    .chart-box.tall { height: 340px; }

    figure.shot {
      margin: 0;
    }

    figure.shot img {
      width: 100%;
      display: block;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #0b1218;
    }

    figure.shot figcaption {
      margin-top: 0.65rem;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.45;
    }

    table.compare {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    table.compare th,
    table.compare td {
      text-align: left;
      padding: 0.65rem 0.5rem;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    table.compare th {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      font-weight: 500;
    }

    table.compare td.num {
      font-family: "IBM Plex Mono", monospace;
      font-variant-numeric: tabular-nums;
    }

    .takeaways {
      display: grid;
      gap: 0.75rem;
    }

    .takeaways li {
      margin: 0;
      padding-left: 0.2rem;
      color: var(--ink);
      line-height: 1.45;
    }

    footer {
      margin-top: 2.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.85rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      justify-content: space-between;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover { text-decoration: underline; }

    .error {
      padding: 1rem;
      border-radius: 12px;
      background: #ffe8e0;
      color: #7a2e12;
      border: 1px solid #f0b39a;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="eyebrow">LLM Inference Runtime Lab · Phase 6</div>
      <h1 id="title">Prefix cache ON vs OFF</h1>
      <p class="lede" id="lede">
        Nsight Systems summaries from a warm A/B on vLLM — what the GPU did when automatic prefix caching was enabled vs disabled.
      </p>
      <div class="meta-row" id="meta-row"></div>
      <p class="caveat" id="caveat"></p>
    </header>

    <div id="app">
      <p class="lede">Loading dashboard data…</p>
    </div>

    <footer>
      <span>Static dashboard · data from <code>nsys stats</code> CSVs</span>
      <span>
        <a href="https://github.com/sudhersankv/gpu-programming">gpu-programming</a>
        ·
        <a href="https://github.com/sudhersankv/gpu-programming/tree/main/llm-inference-runtime-lab">lab folder</a>
      </span>
    </footer>
  </div>

  <script>
    const OFF = "#c45c26";
    const ON = "#0f7a6c";
    const MUTED = "#5a6b78";

    const chartDefaults = {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: "#14212b",
          titleFont: { family: "Outfit" },
          bodyFont: { family: "IBM Plex Mono", size: 12 },
        },
      },
      scales: {
        x: {
          ticks: { color: MUTED, font: { family: "Outfit", size: 11 } },
          grid: { color: "rgba(20,33,43,0.06)" },
        },
        y: {
          ticks: { color: MUTED, font: { family: "IBM Plex Mono", size: 11 } },
          grid: { color: "rgba(20,33,43,0.08)" },
        },
      },
    };

    function fmt(n, digits = 0) {
      return Number(n).toLocaleString(undefined, {
        maximumFractionDigits: digits,
        minimumFractionDigits: digits,
      });
    }

    function memByOp(side, opSubstr) {
      return side.mem.find((m) => m.operation.includes(opSubstr));
    }

    function render(data) {
      document.getElementById("title").textContent = data.meta.title;
      document.getElementById("caveat").textContent = data.meta.caveat;
      document.getElementById("meta-row").innerHTML = [
        data.meta.model,
        data.meta.gpu,
        data.meta.protocol,
      ].map((t) => `<span class="chip">${t}</span>`).join("");

      const off = data.cache_off;
      const on = data.cache_on;
      const htodOff = memByOp(off, "Host-to-Device");
      const htodOn = memByOp(on, "Host-to-Device");
      const dtohOff = memByOp(off, "Device-to-Host");
      const dtohOn = memByOp(on, "Device-to-Host");

      const app = document.getElementById("app");
      app.innerHTML = `
        <section>
          <h2>Session snapshot</h2>
          <div class="grid grid-4">
            <div class="panel kpi">
              <span class="label">HtoD count · OFF</span>
              <span class="value" style="color:${OFF}">${fmt(htodOff.count)}</span>
              <span class="sub">${fmt(htodOff.total_mb, 1)} MB · med ${fmt(htodOff.med_ns)} ns</span>
            </div>
            <div class="panel kpi">
              <span class="label">HtoD count · ON</span>
              <span class="value" style="color:${ON}">${fmt(htodOn.count)}</span>
              <span class="sub">${fmt(htodOn.total_mb, 1)} MB · med ${fmt(htodOn.med_ns)} ns</span>
            </div>
            <div class="panel kpi">
              <span class="label">Top kernel time · OFF</span>
              <span class="value">${fmt(off.kernels[0].total_time_ms / 1000, 1)}s</span>
              <span class="sub">${off.kernels[0].name}</span>
            </div>
            <div class="panel kpi">
              <span class="label">Top kernel time · ON</span>
              <span class="value">${fmt(on.kernels[0].total_time_ms / 1000, 1)}s</span>
              <span class="sub">${on.kernels[0].name}</span>
            </div>
          </div>
        </section>

        <section>
          <h2>Client TTFT (prefix hit illustration)</h2>
          <div class="panel">
            <div class="chart-box" style="height:220px"><canvas id="ttftChart"></canvas></div>
            <p class="note">${data.client_ttft.note} Source: ${data.client_ttft.source}</p>
          </div>
        </section>

        <section>
          <h2>Memory transfers</h2>
          <div class="legend">
            <span class="swatch off"><i></i> Cache OFF</span>
            <span class="swatch on"><i></i> Cache ON</span>
          </div>
          <div class="grid grid-2">
            <div class="panel">
              <div class="chart-box"><canvas id="memCountChart"></canvas></div>
              <p class="note">Whole-session copy counts. Nearly identical — model load dominates.</p>
            </div>
            <div class="panel">
              <div class="chart-box"><canvas id="memTimeChart"></canvas></div>
              <p class="note">Total HtoD time is dominated by weight upload, not Q2.</p>
            </div>
          </div>
        </section>

        <section>
          <h2>Top kernels by total GPU time</h2>
          <div class="legend">
            <span class="swatch off"><i></i> Cache OFF</span>
            <span class="swatch on"><i></i> Cache ON</span>
          </div>
          <div class="panel">
            <div class="chart-box tall"><canvas id="kernChart"></canvas></div>
          </div>
        </section>

        <section>
          <h2>CUDA API (CPU-side)</h2>
          <div class="grid grid-2">
            <div class="panel">
              <div class="chart-box"><canvas id="apiChart"></canvas></div>
            </div>
            <div class="panel">
              <table class="compare">
                <thead>
                  <tr><th>Signal</th><th>OFF</th><th>ON</th></tr>
                </thead>
                <tbody>
                  <tr>
                    <td>reshape_and_cache calls</td>
                    <td class="num">${fmt(off.signals.reshape_and_cache?.instances ?? 0)}</td>
                    <td class="num">${fmt(on.signals.reshape_and_cache?.instances ?? 0)}</td>
                  </tr>
                  <tr>
                    <td>flash_fwd instances</td>
                    <td class="num">${fmt(off.signals.flash_fwd?.instances ?? 0)}</td>
                    <td class="num">${fmt(on.signals.flash_fwd?.instances ?? 0)}</td>
                  </tr>
                  <tr>
                    <td>cudaMemcpyAsync calls</td>
                    <td class="num">${fmt(off.api.find(a => a.name === "cudaMemcpyAsync")?.num_calls ?? 0)}</td>
                    <td class="num">${fmt(on.api.find(a => a.name === "cudaMemcpyAsync")?.num_calls ?? 0)}</td>
                  </tr>
                  <tr>
                    <td>DtoH count</td>
                    <td class="num">${fmt(dtohOff.count)}</td>
                    <td class="num">${fmt(dtohOn.count)}</td>
                  </tr>
                </tbody>
              </table>
              <p class="note">Session aggregates wash out the per-request APC signature — use the timeline below.</p>
            </div>
          </div>
        </section>

        <section>
          <h2>Timeline around measured requests</h2>
          <div class="grid grid-2">
            <figure class="panel shot">
              <img src="assets/warm_overview.png" alt="Zoomed-out Nsight: cache off vs cache on" />
              <figcaption><strong>Zoomed out</strong> — left OFF, right ON. Broad shape looks similar after long init.</figcaption>
            </figure>
            <figure class="panel shot">
              <img src="assets/warm_events.png" alt="Events view: tiny HtoD burst when cache on" />
              <figcaption><strong>Events</strong> — OFF is mostly kernels; ON shows a burst of tiny Host→Device copies before transformer kernels (metadata-sized, not bulk KV restore).</figcaption>
            </figure>
          </div>
        </section>

        <section>
          <h2>Takeaways</h2>
          <div class="panel">
            <ul class="takeaways">
              <li>Prefix-cache hits do <strong>not</strong> H→D restore shared KV; KV stays resident in GPU HBM.</li>
              <li>On a hit, Nsight shows tiny H→D memcpys consistent with request metadata (e.g. block tables), then kernels reuse resident KV.</li>
              <li>Whole-session <code>nsys stats</code> HtoD counts match (both ${fmt(htodOff.count)}) because load/init dwarf Q2.</li>
              <li>Client TTFT still drops on the second shared-prefix question when APC is on.</li>
            </ul>
          </div>
        </section>
      `;

      // TTFT
      new Chart(document.getElementById("ttftChart"), {
        type: "bar",
        data: {
          labels: data.client_ttft.series.map((s) => s.label),
          datasets: [{
            data: data.client_ttft.series.map((s) => s.ttft_s),
            backgroundColor: [OFF, ON],
            borderRadius: 8,
            maxBarThickness: 72,
          }],
        },
        options: {
          ...chartDefaults,
          plugins: { ...chartDefaults.plugins, legend: { display: false } },
          scales: {
            ...chartDefaults.scales,
            y: {
              ...chartDefaults.scales.y,
              title: { display: true, text: "TTFT (s)", color: MUTED, font: { family: "Outfit" } },
            },
          },
        },
      });

      const memLabels = ["HtoD", "DtoH", "DtoD", "memset"];
      const pick = (side, key) => {
        const map = {
          HtoD: memByOp(side, "Host-to-Device"),
          DtoH: memByOp(side, "Device-to-Host"),
          DtoD: memByOp(side, "Device-to-Device"),
          memset: memByOp(side, "memset"),
        };
        return map[key];
      };

      new Chart(document.getElementById("memCountChart"), {
        type: "bar",
        data: {
          labels: memLabels,
          datasets: [
            { label: "OFF", data: memLabels.map((k) => pick(off, k).count), backgroundColor: OFF, borderRadius: 6 },
            { label: "ON", data: memLabels.map((k) => pick(on, k).count), backgroundColor: ON, borderRadius: 6 },
          ],
        },
        options: {
          ...chartDefaults,
          plugins: {
            ...chartDefaults.plugins,
            legend: { display: true, labels: { font: { family: "Outfit" }, color: MUTED } },
          },
        },
      });

      new Chart(document.getElementById("memTimeChart"), {
        type: "bar",
        data: {
          labels: ["HtoD total time (s)"],
          datasets: [
            { label: "OFF", data: [htodOff.total_time_ms / 1000], backgroundColor: OFF, borderRadius: 6, maxBarThickness: 64 },
            { label: "ON", data: [htodOn.total_time_ms / 1000], backgroundColor: ON, borderRadius: 6, maxBarThickness: 64 },
          ],
        },
        options: {
          ...chartDefaults,
          plugins: {
            ...chartDefaults.plugins,
            legend: { display: true, labels: { font: { family: "Outfit" }, color: MUTED } },
          },
        },
      });

      // Align kernel names: union of top-8 short names by OFF order, match ON by full_name prefix / short name
      const topN = 8;
      const kernLabels = off.kernels.slice(0, topN).map((k) => k.name);
      const onByName = Object.fromEntries(on.kernels.map((k) => [k.name, k]));
      new Chart(document.getElementById("kernChart"), {
        type: "bar",
        data: {
          labels: kernLabels,
          datasets: [
            {
              label: "OFF ms",
              data: off.kernels.slice(0, topN).map((k) => k.total_time_ms),
              backgroundColor: OFF,
              borderRadius: 4,
            },
            {
              label: "ON ms",
              data: kernLabels.map((name) => onByName[name]?.total_time_ms ?? 0),
              backgroundColor: ON,
              borderRadius: 4,
            },
          ],
        },
        options: {
          indexAxis: "y",
          ...chartDefaults,
          plugins: {
            ...chartDefaults.plugins,
            legend: { display: true, labels: { font: { family: "Outfit" }, color: MUTED } },
          },
          scales: {
            x: {
              ...chartDefaults.scales.x,
              title: { display: true, text: "Total GPU time (ms)", color: MUTED, font: { family: "Outfit" } },
            },
            y: {
              ticks: { color: MUTED, font: { family: "IBM Plex Mono", size: 10 } },
              grid: { display: false },
            },
          },
        },
      });

      const apiLabels = off.api.slice(0, 6).map((a) => a.name);
      const onApi = Object.fromEntries(on.api.map((a) => [a.name, a]));
      new Chart(document.getElementById("apiChart"), {
        type: "bar",
        data: {
          labels: apiLabels,
          datasets: [
            {
              label: "OFF",
              data: off.api.slice(0, 6).map((a) => a.total_time_ms / 1000),
              backgroundColor: OFF,
              borderRadius: 4,
            },
            {
              label: "ON",
              data: apiLabels.map((n) => (onApi[n]?.total_time_ms ?? 0) / 1000),
              backgroundColor: ON,
              borderRadius: 4,
            },
          ],
        },
        options: {
          indexAxis: "y",
          ...chartDefaults,
          plugins: {
            ...chartDefaults.plugins,
            legend: { display: true, labels: { font: { family: "Outfit" }, color: MUTED } },
          },
          scales: {
            x: {
              ...chartDefaults.scales.x,
              title: { display: true, text: "CPU API time (s)", color: MUTED, font: { family: "Outfit" } },
            },
            y: {
              ticks: { color: MUTED, font: { family: "IBM Plex Mono", size: 10 } },
              grid: { display: false },
            },
          },
        },
      });
    }

    fetch("./data.json")
      .then((r) => {
        if (!r.ok) throw new Error("Could not load data.json");
        return r.json();
      })
      .then(render)
      .catch((err) => {
        document.getElementById("app").innerHTML =
          `<div class="error">Failed to load dashboard data: ${err.message}. Open this page via a local server or GitHub Pages (file:// cannot fetch JSON).</div>`;
      });
  </script>
</body>
</html>
