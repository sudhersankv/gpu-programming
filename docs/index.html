<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profiling vLLM Automatic Prefix Caching</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --ink: #14212b;
      --muted: #5a6b78;
      --line: rgba(20, 33, 43, 0.12);
      --paper: #f3f6f8;
      --panel: rgba(255, 255, 255, 0.78);
      --off: #c45c26;
      --on: #0f7a6c;
      --accent: #1f6f8b;
      --shadow: 0 18px 50px rgba(20, 33, 43, 0.08);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: "Outfit", system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(31, 111, 139, 0.16), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(15, 122, 108, 0.12), transparent 50%),
        linear-gradient(180deg, #e8eef2 0%, var(--paper) 40%, #eef3f5 100%);
      min-height: 100vh;
    }
    .wrap { width: min(1080px, calc(100% - 2rem)); margin: 0 auto; padding: 2.25rem 0 3.5rem; }
    .eyebrow {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 500;
      margin: 0 0 0.65rem;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.85rem, 4.2vw, 2.65rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.12;
      max-width: 18ch;
    }
    .lede {
      margin: 0.85rem 0 0;
      max-width: 40rem;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.55;
    }
    .meta-row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
    .chip {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      padding: 0.32rem 0.6rem;
      border-radius: 999px;
      background: rgba(255,255,255,0.7);
      border: 1px solid var(--line);
    }
    section { margin-top: 2rem; }
    section h2 {
      margin: 0 0 0.75rem;
      font-size: 1.2rem;
      letter-spacing: -0.02em;
    }
    .grid { display: grid; gap: 1rem; }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    @media (max-width: 860px) {
      .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
      h1 { max-width: none; }
    }
    .panel {
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.1rem 1.15rem 1.2rem;
    }
    .panel p, .panel .note, .panel li {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
    }
    .panel p { margin: 0.5rem 0 0; }
    .panel .note { margin: 0.55rem 0 0; font-size: 0.85rem; }
    .kpi { display: flex; flex-direction: column; gap: 0.3rem; min-height: 100%; }
    .kpi .label {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .kpi .value {
      font-size: clamp(1.55rem, 3vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .kpi .sub { font-size: 0.82rem; color: var(--muted); }
    .hero-result .value { font-size: clamp(1.8rem, 4vw, 2.35rem); }
    .legend { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 0.7rem; font-size: 0.88rem; }
    .swatch { display: inline-flex; align-items: center; gap: 0.4rem; }
    .swatch i { width: 0.7rem; height: 0.7rem; border-radius: 3px; display: inline-block; }
    .swatch.off i { background: var(--off); }
    .swatch.on i { background: var(--on); }
    .chart-box { position: relative; height: 250px; }
    .chart-box.sm { height: 210px; }
    figure.shot { margin: 0; }
    figure.shot img {
      width: 100%;
      display: block;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #0b1218;
    }
    figure.shot figcaption {
      margin-top: 0.6rem;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.45;
    }
    table.compare { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    table.compare th, table.compare td {
      text-align: left;
      padding: 0.6rem 0.45rem;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    table.compare th {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      font-weight: 500;
    }
    table.compare td.num {
      font-family: "IBM Plex Mono", monospace;
      font-variant-numeric: tabular-nums;
    }
    ul.clean { margin: 0; padding-left: 1.1rem; }
    ul.clean li { margin: 0.35rem 0; color: var(--ink); }
    ul.clean li span { color: var(--muted); }
    .links { display: flex; flex-wrap: wrap; gap: 0.65rem 1.1rem; margin-top: 0.75rem; }
    .links a { color: var(--accent); text-decoration: none; font-size: 0.92rem; }
    .links a:hover { text-decoration: underline; }
    footer {
      margin-top: 2.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.84rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      justify-content: space-between;
    }
    footer a { color: var(--accent); text-decoration: none; }
    .error {
      padding: 1rem;
      border-radius: 12px;
      background: #ffe8e0;
      color: #7a2e12;
      border: 1px solid #f0b39a;
    }
    .one-liner {
      margin: 0.85rem 0 0;
      padding: 0.85rem 1rem;
      border-left: 3px solid var(--on);
      background: rgba(255,255,255,0.55);
      border-radius: 0 12px 12px 0;
      color: var(--ink);
      font-size: 0.98rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="eyebrow">LLM Inference Runtime Lab</p>
      <h1 id="title">Profiling vLLM Automatic Prefix Caching</h1>
      <p class="lede" id="subtitle"></p>
      <div class="meta-row" id="chips"></div>
    </header>
    <div id="app"><p class="lede">Loading…</p></div>
    <footer>
      <span>Static case study · client timings + Nsight Systems</span>
      <span id="footer-links"></span>
    </footer>
  </div>

  <script>
    const OFF = "#c45c26";
    const ON = "#0f7a6c";
    const MUTED = "#5a6b78";

    const chartDefaults = {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: "#14212b",
          titleFont: { family: "Outfit" },
          bodyFont: { family: "IBM Plex Mono", size: 12 },
        },
      },
      scales: {
        x: {
          ticks: { color: MUTED, font: { family: "Outfit", size: 11 } },
          grid: { color: "rgba(20,33,43,0.06)" },
        },
        y: {
          ticks: { color: MUTED, font: { family: "IBM Plex Mono", size: 11 } },
          grid: { color: "rgba(20,33,43,0.08)" },
        },
      },
    };

    function fmt(n, digits = 0) {
      return Number(n).toLocaleString(undefined, {
        maximumFractionDigits: digits,
        minimumFractionDigits: digits,
      });
    }

    function memByOp(side, opSubstr) {
      return side.mem.find((m) => m.operation.includes(opSubstr));
    }

    function render(data) {
      const meta = data.meta;
      const client = data.client;
      if (!client?.request_2) {
        document.getElementById("app").innerHTML =
          `<div class="error">Missing client warm A/B metrics in data.json. Rebuild with build_apc_dashboard_data.py.</div>`;
        return;
      }

      document.getElementById("title").textContent = meta.title;
      document.getElementById("subtitle").textContent = meta.subtitle;
      document.getElementById("chips").innerHTML = (meta.chips || [])
        .map((t) => `<span class="chip">${t}</span>`).join("");
      document.getElementById("footer-links").innerHTML =
        `<a href="${meta.repo_url}">repository</a> · <a href="${meta.lab_readme_url}">lab README</a>`;

      const r2 = client.request_2;
      const r1 = client.request_1_match;
      const on = data.cache_on;
      const off = data.cache_off;
      const sql = data.sqlite;
      const findings = data.nsight_findings || { bullets: [], kernels: [] };

      const app = document.getElementById("app");
      app.innerHTML = `
        <section>
          <h2>Main result</h2>
          <div class="grid grid-4">
            <div class="panel kpi hero-result">
              <span class="label">Request 2 TTFT · cache OFF</span>
              <span class="value" style="color:${OFF}">${fmt(r2.off_ttft_ms, 1)} ms</span>
              <span class="sub">Time to first token</span>
            </div>
            <div class="panel kpi hero-result">
              <span class="label">Request 2 TTFT · cache ON</span>
              <span class="value" style="color:${ON}">${fmt(r2.on_ttft_ms, 1)} ms</span>
              <span class="sub">Same prompts &amp; hardware</span>
            </div>
            <div class="panel kpi hero-result">
              <span class="label">Speedup</span>
              <span class="value">${fmt(r2.ttft_speedup, 1)}×</span>
              <span class="sub">${fmt(r2.ttft_saved_ms, 1)} ms saved</span>
            </div>
            <div class="panel kpi hero-result">
              <span class="label">TTFT reduction</span>
              <span class="value">${fmt(r2.ttft_reduction_pct, 1)}%</span>
              <span class="sub">vs cache OFF Request 2</span>
            </div>
          </div>
          <p class="one-liner">
            After Request 1 populated the KV cache, Request 2 reused the shared paper prefix
            instead of recomputing its full prefill.
          </p>
          <div class="panel" style="margin-top:1rem">
            <div class="legend">
              <span class="swatch off"><i></i> Cache OFF</span>
              <span class="swatch on"><i></i> Cache ON</span>
            </div>
            <div class="chart-box sm"><canvas id="r2Chart"></canvas></div>
            <p class="note">Primary metric: client-measured TTFT on the second shared-prefix request.</p>
          </div>
        </section>

        <section>
          <h2>Controlled experiment</h2>
          <div class="panel">
            <ul class="clean">
              <li>An <strong>unrelated</strong> short request warmed CUDA / runtime paths without seeding the Qasper paper into the prefix cache.</li>
              <li><strong>Request 1</strong> used the shared paper + question A — a cache miss in both runs.</li>
              <li><strong>Request 2</strong> reused the same paper with a different question — hit when caching is on, full re-prefill when off.</li>
              <li>Both arms used the same model, prompts, generation length, GPU, and benchmark harness.</li>
            </ul>
            <table class="compare" style="margin-top:0.85rem">
              <thead>
                <tr><th>Request 1 TTFT (miss)</th><th>Cache OFF</th><th>Cache ON</th></tr>
              </thead>
              <tbody>
                <tr>
                  <td>Matched warm miss</td>
                  <td class="num">${fmt(r1.off_ttft_ms, 1)} ms</td>
                  <td class="num">${fmt(r1.on_ttft_ms, 1)} ms</td>
                </tr>
                <tr>
                  <td>Request 2 TTFT</td>
                  <td class="num">${fmt(client.cache_off.request_2.ttft_ms, 1)} ms</td>
                  <td class="num">${fmt(client.cache_on.request_2.ttft_ms, 1)} ms</td>
                </tr>
                <tr>
                  <td>Request 2 E2E</td>
                  <td class="num">${fmt(client.cache_off.request_2.e2e_s, 3)} s</td>
                  <td class="num">${fmt(client.cache_on.request_2.e2e_s, 3)} s</td>
                </tr>
                <tr>
                  <td>Request 2 output tok/s</td>
                  <td class="num">${fmt(client.cache_off.request_2.output_tok_per_s, 1)}</td>
                  <td class="num">${fmt(client.cache_on.request_2.output_tok_per_s, 1)}</td>
                </tr>
              </tbody>
            </table>
            <p class="note">
              Request 1 TTFTs differ by only ${fmt(r1.abs_delta_ms, 1)} ms, so the Request 2 gap is explained by
              prefix reuse — not cold startup.
            </p>
          </div>
        </section>

        <section>
          <h2>Nsight findings</h2>
          <div class="grid grid-2">
            <div class="panel">
              <ul class="clean">
                ${findings.bullets.map((b) => `<li>${b}</li>`).join("")}
              </ul>
            </div>
            <div class="panel">
              <p style="margin:0 0 0.45rem;color:var(--ink)"><strong>Representative kernels in the traces</strong></p>
              <ul class="clean">
                ${findings.kernels.map((k) => `<li>${k}</li>`).join("")}
              </ul>
            </div>
          </div>
          <div class="grid grid-2" style="margin-top:1rem">
            <figure class="panel shot">
              <img src="assets/warm_overview.png" alt="Nsight timelines cache off vs on" />
              <figcaption>Full capture shape is similar after init; measured work is in the later request bursts.</figcaption>
            </figure>
            <figure class="panel shot">
              <img src="assets/warm_events.png" alt="Nsight Events view around requests" />
              <figcaption>Events detail: cache ON shows small H→D activity before kernels on a hit; cache OFF spends more time in prefill kernels.</figcaption>
            </figure>
          </div>
        </section>

        <section>
          <h2>Quantitative profiler data</h2>
          ${sql ? `
          <div class="panel" style="margin-bottom:1rem">
            <p style="margin:0;color:var(--ink)"><strong>Late-trace GPU activity comparison</strong></p>
            <p class="note" style="margin-top:0.4rem">
              Filter: last ${sql.cache_off.sqlite_window.window_s}s of each capture
              (<code>CUPTI_ACTIVITY_KIND_KERNEL</code>). This window excludes model loading but may include
              more than Request 2; <strong>benchmark TTFT remains the primary request-level latency measurement</strong>.
            </p>
            <div class="legend" style="margin-top:0.75rem">
              <span class="swatch off"><i></i> Cache OFF</span>
              <span class="swatch on"><i></i> Cache ON</span>
            </div>
            <div class="chart-box"><canvas id="lateKernChart"></canvas></div>
            <p class="note">
              Late-trace kernel time OFF ${fmt(sql.cache_off.kernels_late_30s.total_time_ms / 1000, 2)}s vs
              ON ${fmt(sql.cache_on.kernels_late_30s.total_time_ms / 1000, 2)}s — consistent with more prefill
              compute when the prefix is not reused.
            </p>
          </div>
          <div class="grid grid-2">
            <div class="panel">
              <p style="margin:0 0 0.35rem;color:var(--ink)"><strong>Host→Device by size (whole session)</strong></p>
              <div class="chart-box sm"><canvas id="htodSplitCount"></canvas></div>
              <p class="note">Large (≥1&nbsp;MB) copies are weight upload (~3&nbsp;GB) and match across arms. Tiny copies do not explain the TTFT win.</p>
            </div>
            <div class="panel">
              <table class="compare">
                <thead><tr><th>Whole-session HtoD</th><th>OFF</th><th>ON</th></tr></thead>
                <tbody>
                  <tr>
                    <td>All HtoD</td>
                    <td class="num">${fmt(sql.cache_off.htod_session.all_htod.count)} · ${fmt(sql.cache_off.htod_session.all_htod.total_mb, 0)} MB</td>
                    <td class="num">${fmt(sql.cache_on.htod_session.all_htod.count)} · ${fmt(sql.cache_on.htod_session.all_htod.total_mb, 0)} MB</td>
                  </tr>
                  <tr>
                    <td>≥1&nbsp;MB</td>
                    <td class="num">${fmt(sql.cache_off.htod_session.large_ge_1mb.count)}</td>
                    <td class="num">${fmt(sql.cache_on.htod_session.large_ge_1mb.count)}</td>
                  </tr>
                  <tr>
                    <td>&lt;4&nbsp;KB</td>
                    <td class="num">${fmt(sql.cache_off.htod_session.tiny_lt_4kb.count)}</td>
                    <td class="num">${fmt(sql.cache_on.htod_session.tiny_lt_4kb.count)}</td>
                  </tr>
                </tbody>
              </table>
              <p class="note">Whole-session CUDA API / kernel totals are dominated by load and compilation — use them as context, not as the Request 2 result.</p>
            </div>
          </div>
          ` : `<div class="panel"><p class="note">SQLite-filtered profiler metrics not present. Run query_nsys_sqlite.py locally to refresh.</p></div>`}
        </section>

        <section>
          <h2>Engineering work demonstrated</h2>
          <div class="panel">
            <ul class="clean">
              <li>Deterministic shared-prefix workload generation (Qasper)</li>
              <li>Repeatable TTFT / E2E / throughput benchmark harness</li>
              <li>Containerized vLLM serving</li>
              <li>Automatic cache ON/OFF experiment orchestration</li>
              <li>Nsight Systems capture and timeline analysis</li>
              <li><code>nsys stats</code> CSV export</li>
              <li>Direct SQLite / CUPTI analysis</li>
              <li>Static GitHub Pages visualization</li>
            </ul>
            <div class="links">
              <a href="${meta.repo_url}">Repository</a>
              <a href="${meta.lab_readme_url}">Lab README</a>
              <a href="${meta.harness_url}">Profiling harness</a>
              <a href="${meta.scripts_url}">Dashboard data scripts</a>
            </div>
          </div>
        </section>
      `;

      new Chart(document.getElementById("r2Chart"), {
        type: "bar",
        data: {
          labels: ["Request 2 TTFT (ms)"],
          datasets: [
            { label: "Cache OFF", data: [r2.off_ttft_ms], backgroundColor: OFF, borderRadius: 8, maxBarThickness: 72 },
            { label: "Cache ON", data: [r2.on_ttft_ms], backgroundColor: ON, borderRadius: 8, maxBarThickness: 72 },
          ],
        },
        options: {
          ...chartDefaults,
          plugins: {
            ...chartDefaults.plugins,
            legend: { display: true, labels: { font: { family: "Outfit" }, color: MUTED } },
          },
        },
      });

      if (sql) {
        const sigKeys = [
          ["gemm_ampere", "ampere GEMM"],
          ["flash_fwd", "flash_fwd"],
          ["reshape_and_cache", "reshape_and_cache"],
          ["triton_silu", "triton silu"],
        ];
        new Chart(document.getElementById("lateKernChart"), {
          type: "bar",
          data: {
            labels: sigKeys.map(([, label]) => label),
            datasets: [
              {
                label: "OFF ms",
                data: sigKeys.map(([k]) => sql.cache_off.kernels_late_30s.signals[k].total_time_ms),
                backgroundColor: OFF,
                borderRadius: 6,
              },
              {
                label: "ON ms",
                data: sigKeys.map(([k]) => sql.cache_on.kernels_late_30s.signals[k].total_time_ms),
                backgroundColor: ON,
                borderRadius: 6,
              },
            ],
          },
          options: {
            ...chartDefaults,
            plugins: {
              ...chartDefaults.plugins,
              legend: { display: true, labels: { font: { family: "Outfit" }, color: MUTED } },
            },
            scales: {
              ...chartDefaults.scales,
              y: {
                ...chartDefaults.scales.y,
                title: { display: true, text: "GPU time (ms), last 30s of trace", color: MUTED, font: { family: "Outfit" } },
              },
            },
          },
        });

        new Chart(document.getElementById("htodSplitCount"), {
          type: "bar",
          data: {
            labels: ["Tiny <4KB", "Large ≥1MB"],
            datasets: [
              {
                label: "OFF",
                data: [
                  sql.cache_off.htod_session.tiny_lt_4kb.count,
                  sql.cache_off.htod_session.large_ge_1mb.count,
                ],
                backgroundColor: OFF,
                borderRadius: 6,
              },
              {
                label: "ON",
                data: [
                  sql.cache_on.htod_session.tiny_lt_4kb.count,
                  sql.cache_on.htod_session.large_ge_1mb.count,
                ],
                backgroundColor: ON,
                borderRadius: 6,
              },
            ],
          },
          options: {
            ...chartDefaults,
            plugins: {
              ...chartDefaults.plugins,
              legend: { display: true, labels: { font: { family: "Outfit" }, color: MUTED } },
            },
          },
        });
      }
    }

    fetch("./data.json")
      .then((r) => {
        if (!r.ok) throw new Error("Could not load data.json");
        return r.json();
      })
      .then(render)
      .catch((err) => {
        document.getElementById("app").innerHTML =
          `<div class="error">Failed to load dashboard data: ${err.message}</div>`;
      });
  </script>
</body>
</html>
