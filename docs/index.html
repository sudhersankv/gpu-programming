<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>APC Nsight A/B — LLM Inference Runtime Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --ink: #14212b;
      --muted: #5a6b78;
      --line: rgba(20, 33, 43, 0.12);
      --paper: #f3f6f8;
      --panel: rgba(255, 255, 255, 0.78);
      --off: #c45c26;
      --on: #0f7a6c;
      --accent: #1f6f8b;
      --shadow: 0 18px 50px rgba(20, 33, 43, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: "Outfit", system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(31, 111, 139, 0.16), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(15, 122, 108, 0.12), transparent 50%),
        linear-gradient(180deg, #e8eef2 0%, var(--paper) 40%, #eef3f5 100%);
      min-height: 100vh;
    }

    .wrap {
      width: min(1120px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2.5rem 0 4rem;
    }

    header.hero {
      display: grid;
      gap: 1rem;
      margin-bottom: 2rem;
      padding: 1.75rem 0 0.5rem;
    }

    .eyebrow {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 500;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.85rem, 4vw, 2.75rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      max-width: 16ch;
    }

    .lede {
      margin: 0;
      max-width: 42rem;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.55;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      margin-top: 0.35rem;
    }

    .chip {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.75rem;
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      background: rgba(255,255,255,0.7);
      border: 1px solid var(--line);
      color: var(--ink);
    }

    .caveat {
      margin-top: 0.5rem;
      padding: 0.9rem 1rem;
      border-left: 3px solid var(--accent);
      background: rgba(255,255,255,0.55);
      border-radius: 0 12px 12px 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      gap: 1.1rem;
    }

    .grid-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    @media (max-width: 860px) {
      .grid-2, .grid-4 { grid-template-columns: 1fr; }
    }

    section {
      margin-top: 1.75rem;
    }

    section h2 {
      margin: 0 0 0.75rem;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }

    .panel {
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.15rem 1.2rem 1.25rem;
    }

    .panel p.note {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.45;
    }

    .kpi {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      min-height: 100%;
    }

    .kpi .label {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .kpi .value {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .kpi .sub {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .legend {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
      font-size: 0.88rem;
    }

    .swatch {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .swatch i {
      width: 0.7rem;
      height: 0.7rem;
      border-radius: 3px;
      display: inline-block;
    }

    .swatch.off i { background: var(--off); }
    .swatch.on i { background: var(--on); }

    .chart-box {
      position: relative;
      height: 280px;
    }

    .chart-box.tall { height: 340px; }

    figure.shot {
      margin: 0;
    }

    figure.shot img {
      width: 100%;
      display: block;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #0b1218;
    }

    figure.shot figcaption {
      margin-top: 0.65rem;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.45;
    }

    table.compare {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    table.compare th,
    table.compare td {
      text-align: left;
      padding: 0.65rem 0.5rem;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    table.compare th {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      font-weight: 500;
    }

    table.compare td.num {
      font-family: "IBM Plex Mono", monospace;
      font-variant-numeric: tabular-nums;
    }

    .takeaways {
      display: grid;
      gap: 0.75rem;
    }

    .takeaways li {
      margin: 0;
      padding-left: 0.2rem;
      color: var(--ink);
      line-height: 1.45;
    }

    footer {
      margin-top: 2.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.85rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      justify-content: space-between;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover { text-decoration: underline; }

    .error {
      padding: 1rem;
      border-radius: 12px;
      background: #ffe8e0;
      color: #7a2e12;
      border: 1px solid #f0b39a;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="eyebrow">LLM Inference Runtime Lab · Phase 6</div>
      <h1 id="title">Prefix cache ON vs OFF</h1>
      <p class="lede" id="lede">
        Nsight Systems summaries from a warm A/B on vLLM — what the GPU did when automatic prefix caching was enabled vs disabled.
      </p>
      <div class="meta-row" id="meta-row"></div>
      <p class="caveat" id="caveat"></p>
    </header>

    <div id="app">
      <p class="lede">Loading dashboard data…</p>
    </div>

    <footer>
      <span>Static dashboard · data from <code>nsys stats</code> CSVs</span>
      <span>
        <a href="https://github.com/sudhersankv/gpu-programming">gpu-programming</a>
        ·
        <a href="https://github.com/sudhersankv/gpu-programming/tree/main/llm-inference-runtime-lab">lab folder</a>
      </span>
    </footer>
  </div>

  <script>
    const OFF = "#c45c26";
    const ON = "#0f7a6c";
    const MUTED = "#5a6b78";

    const chartDefaults = {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: "#14212b",
          titleFont: { family: "Outfit" },
          bodyFont: { family: "IBM Plex Mono", size: 12 },
        },
      },
      scales: {
        x: {
          ticks: { color: MUTED, font: { family: "Outfit", size: 11 } },
          grid: { color: "rgba(20,33,43,0.06)" },
        },
        y: {
          ticks: { color: MUTED, font: { family: "IBM Plex Mono", size: 11 } },
          grid: { color: "rgba(20,33,43,0.08)" },
        },
      },
    };

    function fmt(n, digits = 0) {
      return Number(n).toLocaleString(undefined, {
        maximumFractionDigits: digits,
        minimumFractionDigits: digits,
      });
    }

    function memByOp(side, opSubstr) {
      return side.mem.find((m) => m.operation.includes(opSubstr));
    }

    function render(data) {
      document.getElementById("title").textContent = data.meta.title;
      document.getElementById("caveat").textContent = data.meta.caveat;
      document.getElementById("meta-row").innerHTML = [
        data.meta.model,
        data.meta.gpu,
        data.meta.protocol,
      ].map((t) => `<span class="chip">${t}</span>`).join("");

      const off = data.cache_off;
      const on = data.cache_on;
      const sql = data.sqlite;
      if (!sql?.cache_off || !sql?.cache_on) {
        document.getElementById("app").innerHTML =
          `<div class="error">data.json is missing the <code>sqlite</code> section. Run <code>python scripts/query_nsys_sqlite.py</code> locally (needs .sqlite next to the .nsys-rep files).</div>`;
        return;
      }
      const sOff = sql.cache_off;
      const sOn = sql.cache_on;
      const htodOff = memByOp(off, "Host-to-Device");
      const htodOn = memByOp(on, "Host-to-Device");
      const kernOff = sOff.kernels_late_30s.total_time_ms;
      const kernOn = sOn.kernels_late_30s.total_time_ms;
      const ratio = kernOff / kernOn;

      const app = document.getElementById("app");
      app.innerHTML = `
        <section>
          <h2>Where APC shows up (SQLite · last 30s of trace)</h2>
          <div class="grid grid-4">
            <div class="panel kpi">
              <span class="label">GPU kernel time · OFF</span>
              <span class="value" style="color:${OFF}">${fmt(kernOff / 1000, 2)}s</span>
              <span class="sub">${fmt(sOff.kernels_late_30s.count)} launches</span>
            </div>
            <div class="panel kpi">
              <span class="label">GPU kernel time · ON</span>
              <span class="value" style="color:${ON}">${fmt(kernOn / 1000, 2)}s</span>
              <span class="sub">${fmt(sOn.kernels_late_30s.count)} launches</span>
            </div>
            <div class="panel kpi">
              <span class="label">OFF / ON kernel time</span>
              <span class="value">${fmt(ratio, 2)}×</span>
              <span class="sub">Cache OFF recomputes more prefill work</span>
            </div>
            <div class="panel kpi">
              <span class="label">ampere GEMM · last 30s</span>
              <span class="value">${fmt(sOff.kernels_late_30s.signals.gemm_ampere.total_time_ms / 1000, 2)}s / ${fmt(sOn.kernels_late_30s.signals.gemm_ampere.total_time_ms / 1000, 2)}s</span>
              <span class="sub">OFF vs ON</span>
            </div>
          </div>
          <div class="panel" style="margin-top:1.1rem">
            <div class="legend">
              <span class="swatch off"><i></i> Cache OFF</span>
              <span class="swatch on"><i></i> Cache ON</span>
            </div>
            <div class="chart-box"><canvas id="lateKernChart"></canvas></div>
            <p class="note">${sOff.sqlite_window.note} Queried from <code>CUPTI_ACTIVITY_KIND_KERNEL</code>.</p>
          </div>
        </section>

        <section>
          <h2>HtoD split: tiny metadata vs large weight uploads</h2>
          <div class="legend">
            <span class="swatch off"><i></i> Cache OFF</span>
            <span class="swatch on"><i></i> Cache ON</span>
          </div>
          <div class="grid grid-2">
            <div class="panel">
              <div class="chart-box"><canvas id="htodSplitCount"></canvas></div>
              <p class="note">Session totals: large (≥1&nbsp;MB) copies are the ~3&nbsp;GB model load — same on both. Tiny (&lt;4&nbsp;KB) counts are also similar; APC is not “fewer memcpys overall.”</p>
            </div>
            <div class="panel">
              <div class="chart-box"><canvas id="htodSplitTime"></canvas></div>
              <p class="note">Almost all HtoD <em>time</em> is large uploads. Tiny copies are sub‑millisecond in aggregate — visible on the Events timeline, not in session time bars.</p>
            </div>
          </div>
          <div class="panel" style="margin-top:1.1rem">
            <table class="compare">
              <thead>
                <tr><th>Metric (from SQLite)</th><th>OFF</th><th>ON</th></tr>
              </thead>
              <tbody>
                <tr>
                  <td>Session HtoD all</td>
                  <td class="num">${fmt(sOff.htod_session.all_htod.count)} · ${fmt(sOff.htod_session.all_htod.total_mb, 1)} MB</td>
                  <td class="num">${fmt(sOn.htod_session.all_htod.count)} · ${fmt(sOn.htod_session.all_htod.total_mb, 1)} MB</td>
                </tr>
                <tr>
                  <td>Session HtoD ≥1&nbsp;MB (weights)</td>
                  <td class="num">${fmt(sOff.htod_session.large_ge_1mb.count)} · ${fmt(sOff.htod_session.large_ge_1mb.total_mb, 1)} MB</td>
                  <td class="num">${fmt(sOn.htod_session.large_ge_1mb.count)} · ${fmt(sOn.htod_session.large_ge_1mb.total_mb, 1)} MB</td>
                </tr>
                <tr>
                  <td>Session HtoD &lt;4&nbsp;KB (tiny)</td>
                  <td class="num">${fmt(sOff.htod_session.tiny_lt_4kb.count)} · ${fmt(sOff.htod_session.tiny_lt_4kb.total_mb, 3)} MB</td>
                  <td class="num">${fmt(sOn.htod_session.tiny_lt_4kb.count)} · ${fmt(sOn.htod_session.tiny_lt_4kb.total_mb, 3)} MB</td>
                </tr>
                <tr>
                  <td>Last 30s flash_fwd time</td>
                  <td class="num">${fmt(sOff.kernels_late_30s.signals.flash_fwd.total_time_ms, 1)} ms · n=${fmt(sOff.kernels_late_30s.signals.flash_fwd.instances)}</td>
                  <td class="num">${fmt(sOn.kernels_late_30s.signals.flash_fwd.total_time_ms, 1)} ms · n=${fmt(sOn.kernels_late_30s.signals.flash_fwd.instances)}</td>
                </tr>
                <tr>
                  <td>Last 30s reshape_and_cache</td>
                  <td class="num">${fmt(sOff.kernels_late_30s.signals.reshape_and_cache.instances)} · ${fmt(sOff.kernels_late_30s.signals.reshape_and_cache.total_time_ms, 2)} ms</td>
                  <td class="num">${fmt(sOn.kernels_late_30s.signals.reshape_and_cache.instances)} · ${fmt(sOn.kernels_late_30s.signals.reshape_and_cache.total_time_ms, 2)} ms</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>

        <section>
          <h2>Client TTFT (prefix hit illustration)</h2>
          <div class="panel">
            <div class="chart-box" style="height:220px"><canvas id="ttftChart"></canvas></div>
            <p class="note">${data.client_ttft.note} Source: ${data.client_ttft.source}</p>
          </div>
        </section>

        <section>
          <h2>Whole-session nsys stats (why the old chart looked “wrong”)</h2>
          <div class="legend">
            <span class="swatch off"><i></i> Cache OFF</span>
            <span class="swatch on"><i></i> Cache ON</span>
          </div>
          <div class="grid grid-2">
            <div class="panel">
              <div class="chart-box"><canvas id="memCountChart"></canvas></div>
              <p class="note">Identical HtoD counts (${fmt(htodOff.count)}) are correct for the full capture — not a bad export.</p>
            </div>
            <div class="panel">
              <div class="chart-box"><canvas id="apiChart"></canvas></div>
              <p class="note">CPU-side CUDA API time also dominated by load / sync, not Q2.</p>
            </div>
          </div>
        </section>

        <section>
          <h2>Timeline around measured requests</h2>
          <div class="grid grid-2">
            <figure class="panel shot">
              <img src="assets/warm_overview.png" alt="Zoomed-out Nsight: cache off vs cache on" />
              <figcaption><strong>Zoomed out</strong> — left OFF, right ON. Broad shape looks similar after long init.</figcaption>
            </figure>
            <figure class="panel shot">
              <img src="assets/warm_events.png" alt="Events view: tiny HtoD burst when cache on" />
              <figcaption><strong>Events</strong> — OFF is mostly kernels; ON shows a burst of tiny Host→Device copies before transformer kernels (metadata-sized, not bulk KV restore).</figcaption>
            </figure>
          </div>
        </section>

        <section>
          <h2>Takeaways</h2>
          <div class="panel">
            <ul class="takeaways">
              <li>In the <strong>last 30s</strong> of each trace (after weight upload), cache OFF spends <strong>${fmt(ratio, 2)}×</strong> more GPU kernel time than cache ON — mostly GEMM / attention prefill.</li>
              <li>Prefix-cache hits do <strong>not</strong> H→D restore shared KV; that KV stays in GPU HBM. Session HtoD totals stay ~identical (~${fmt(htodOff.total_mb, 0)} MB).</li>
              <li>Tiny HtoD copies exist on both runs; the GUI “burst before kernels” is a timing pattern on a hit, while the quantitative win is <strong>less compute</strong>, not fewer session memcpys.</li>
              <li>Client TTFT still drops on the second shared-prefix question when APC is on.</li>
            </ul>
          </div>
        </section>
      `;

      // Late-window kernel signals (SQLite)
      const sigKeys = [
        ["gemm_ampere", "ampere GEMM"],
        ["flash_fwd", "flash_fwd"],
        ["reshape_and_cache", "reshape_and_cache"],
        ["triton_silu", "triton silu"],
      ];
      new Chart(document.getElementById("lateKernChart"), {
        type: "bar",
        data: {
          labels: sigKeys.map(([, label]) => label),
          datasets: [
            {
              label: "OFF ms",
              data: sigKeys.map(([k]) => sOff.kernels_late_30s.signals[k].total_time_ms),
              backgroundColor: OFF,
              borderRadius: 6,
            },
            {
              label: "ON ms",
              data: sigKeys.map(([k]) => sOn.kernels_late_30s.signals[k].total_time_ms),
              backgroundColor: ON,
              borderRadius: 6,
            },
          ],
        },
        options: {
          ...chartDefaults,
          plugins: {
            ...chartDefaults.plugins,
            legend: { display: true, labels: { font: { family: "Outfit" }, color: MUTED } },
          },
          scales: {
            ...chartDefaults.scales,
            y: {
              ...chartDefaults.scales.y,
              title: { display: true, text: "GPU time in last 30s (ms)", color: MUTED, font: { family: "Outfit" } },
            },
          },
        },
      });

      // Tiny vs large HtoD counts
      new Chart(document.getElementById("htodSplitCount"), {
        type: "bar",
        data: {
          labels: ["Tiny <4KB", "Large ≥1MB"],
          datasets: [
            {
              label: "OFF",
              data: [
                sOff.htod_session.tiny_lt_4kb.count,
                sOff.htod_session.large_ge_1mb.count,
              ],
              backgroundColor: OFF,
              borderRadius: 6,
            },
            {
              label: "ON",
              data: [
                sOn.htod_session.tiny_lt_4kb.count,
                sOn.htod_session.large_ge_1mb.count,
              ],
              backgroundColor: ON,
              borderRadius: 6,
            },
          ],
        },
        options: {
          ...chartDefaults,
          plugins: {
            ...chartDefaults.plugins,
            legend: { display: true, labels: { font: { family: "Outfit" }, color: MUTED } },
          },
        },
      });

      new Chart(document.getElementById("htodSplitTime"), {
        type: "bar",
        data: {
          labels: ["Tiny <4KB (ms)", "Large ≥1MB (s)"],
          datasets: [
            {
              label: "OFF",
              data: [
                sOff.htod_session.tiny_lt_4kb.total_time_ms,
                sOff.htod_session.large_ge_1mb.total_time_ms / 1000,
              ],
              backgroundColor: OFF,
              borderRadius: 6,
            },
            {
              label: "ON",
              data: [
                sOn.htod_session.tiny_lt_4kb.total_time_ms,
                sOn.htod_session.large_ge_1mb.total_time_ms / 1000,
              ],
              backgroundColor: ON,
              borderRadius: 6,
            },
          ],
        },
        options: {
          ...chartDefaults,
          plugins: {
            ...chartDefaults.plugins,
            legend: { display: true, labels: { font: { family: "Outfit" }, color: MUTED } },
          },
        },
      });

      // TTFT
      new Chart(document.getElementById("ttftChart"), {
        type: "bar",
        data: {
          labels: data.client_ttft.series.map((s) => s.label),
          datasets: [{
            data: data.client_ttft.series.map((s) => s.ttft_s),
            backgroundColor: [OFF, ON],
            borderRadius: 8,
            maxBarThickness: 72,
          }],
        },
        options: {
          ...chartDefaults,
          plugins: { ...chartDefaults.plugins, legend: { display: false } },
          scales: {
            ...chartDefaults.scales,
            y: {
              ...chartDefaults.scales.y,
              title: { display: true, text: "TTFT (s)", color: MUTED, font: { family: "Outfit" } },
            },
          },
        },
      });

      const memLabels = ["HtoD", "DtoH", "DtoD", "memset"];
      const pick = (side, key) => {
        const map = {
          HtoD: memByOp(side, "Host-to-Device"),
          DtoH: memByOp(side, "Device-to-Host"),
          DtoD: memByOp(side, "Device-to-Device"),
          memset: memByOp(side, "memset"),
        };
        return map[key];
      };

      new Chart(document.getElementById("memCountChart"), {
        type: "bar",
        data: {
          labels: memLabels,
          datasets: [
            { label: "OFF", data: memLabels.map((k) => pick(off, k).count), backgroundColor: OFF, borderRadius: 6 },
            { label: "ON", data: memLabels.map((k) => pick(on, k).count), backgroundColor: ON, borderRadius: 6 },
          ],
        },
        options: {
          ...chartDefaults,
          plugins: {
            ...chartDefaults.plugins,
            legend: { display: true, labels: { font: { family: "Outfit" }, color: MUTED } },
          },
        },
      });

      const apiLabels = off.api.slice(0, 6).map((a) => a.name);
      const onApi = Object.fromEntries(on.api.map((a) => [a.name, a]));
      new Chart(document.getElementById("apiChart"), {
        type: "bar",
        data: {
          labels: apiLabels,
          datasets: [
            {
              label: "OFF",
              data: off.api.slice(0, 6).map((a) => a.total_time_ms / 1000),
              backgroundColor: OFF,
              borderRadius: 4,
            },
            {
              label: "ON",
              data: apiLabels.map((n) => (onApi[n]?.total_time_ms ?? 0) / 1000),
              backgroundColor: ON,
              borderRadius: 4,
            },
          ],
        },
        options: {
          indexAxis: "y",
          ...chartDefaults,
          plugins: {
            ...chartDefaults.plugins,
            legend: { display: true, labels: { font: { family: "Outfit" }, color: MUTED } },
          },
          scales: {
            x: {
              ...chartDefaults.scales.x,
              title: { display: true, text: "CPU API time (s)", color: MUTED, font: { family: "Outfit" } },
            },
            y: {
              ticks: { color: MUTED, font: { family: "IBM Plex Mono", size: 10 } },
              grid: { display: false },
            },
          },
        },
      });
    }

    fetch("./data.json")
      .then((r) => {
        if (!r.ok) throw new Error("Could not load data.json");
        return r.json();
      })
      .then(render)
      .catch((err) => {
        document.getElementById("app").innerHTML =
          `<div class="error">Failed to load dashboard data: ${err.message}. Open this page via a local server or GitHub Pages (file:// cannot fetch JSON).</div>`;
      });
  </script>
</body>
</html>
